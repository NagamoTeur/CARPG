server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript application/json text/plain image/svg+xml;
  add_header X-Robots-Tag "noindex, nofollow";
  location /assets/ { expires 7d; add_header Cache-Control "public"; add_header X-Robots-Tag "noindex, nofollow"; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow"; }
}
